<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rovina &amp; Tejas</title>
<meta name="description" content="Rovina & Tejas are getting married. Event details, venues and RSVP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="videos/web/sunset-wide.jpg">
<!-- To change text, fonts, colours or videos, edit config.js — not this file. -->
<script src="config.js"></script>
<script src="shared.js"></script>
<style>
/* Layout idea: real golden-hour sea footage fills the opening screen; the page below is warm sand, each section rising out of a gentle wave edge; a drone shoreline band sits mid-page and the page closes on blossoms. */
:root{
  --bg:#fff8f0; --bg2:#ffffff; --ink:#1f2b3d; --muted:#6d6a75; --soft:#ffd2a8; --accent:#c8603f; --gold:#c98a1c;
  --sea1:#2f6f8f; --sea2:#143a5a; --sun:#ffe08a; --tint:#2a1a2e;
  --accent-ink:#fff;
  --line:color-mix(in srgb, var(--accent) 22%, transparent);
  --f-script:"Great Vibes", cursive; --f-head:"Cormorant Garamond", Georgia, serif; --f-body:"Mulish", "Segoe UI", system-ui, sans-serif;
  --speed:1; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;overflow-x:hidden;transition:background .6s,color .6s}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.center{text-align:center}
.eyebrow{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sec-title{font-family:var(--f-script);font-weight:400;font-size:clamp(48px,8vw,84px);color:var(--accent);margin:4px 0 10px;line-height:1.15}
.lede{color:var(--muted);max-width:60ch;margin-inline:auto}

section{padding:110px 0 100px;position:relative;background:var(--sb,var(--bg))}
section:nth-of-type(even){--sb:color-mix(in srgb,var(--soft) 18%,var(--bg))}
section.vband{--sb:transparent}
.edge{position:absolute;left:0;right:0;top:-38px;height:40px;overflow:hidden;pointer-events:none;z-index:2}
.edge svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:drift calc(26s*var(--speed)) linear infinite}
.edge path{fill:var(--sb,var(--bg))}
@keyframes drift{to{transform:translateX(-50%)}}
.sunmark{display:block;width:120px;height:48px;margin:0 auto 14px}
.sunmark path{stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset calc(1.8s*var(--speed)) ease}
.sunmark.in path,html:not(.js) .sunmark path,.no-reveal .sunmark path{stroke-dashoffset:0}

/* nav: light over the video, solid once scrolled */
#progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--sun),var(--accent),var(--sea1));z-index:70}
nav{position:fixed;top:0;left:0;right:0;z-index:60;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .4s,box-shadow .4s}
nav .mono,nav .links a{color:#fff;transition:color .4s}
nav .burger span{background:#fff}
nav.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
nav.solid .mono{color:var(--accent)} nav.solid .links a{color:var(--ink)} nav.solid .burger span{background:var(--ink)}
nav.hide{transform:translateY(-100%)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.mono{font-family:var(--f-script);font-size:32px;text-decoration:none;line-height:1}
.links{display:flex;gap:22px;list-style:none;margin:0;padding:0}
.links a{text-decoration:none;font-size:14px;letter-spacing:.08em;position:relative;padding:4px 0;text-shadow:0 1px 8px rgba(0,0,0,.25)}
nav.solid .links a{text-shadow:none}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--sun);transform:scaleX(0);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
nav.solid .links a::after{background:var(--accent)}
.links a:hover::after,.links a.active::after{transform:scaleX(1)}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;position:relative}
.burger span{position:absolute;left:11px;right:11px;height:2px;border-radius:2px;transition:transform .4s,opacity .3s}
.burger span:nth-child(1){top:15px}.burger span:nth-child(2){top:21px}.burger span:nth-child(3){top:27px}
.burger.x span:nth-child(1){transform:translateY(6px) rotate(45deg)}.burger.x span:nth-child(2){opacity:0}.burger.x span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media (max-width:860px){
  .burger{display:block}
  .links{position:fixed;inset:64px 0 auto 0;flex-direction:column;gap:0;background:var(--bg2);box-shadow:0 20px 40px rgba(0,0,0,.1);clip-path:inset(0 0 100% 0);transition:clip-path .5s cubic-bezier(.2,.8,.2,1)}
  .links.open{clip-path:inset(0 0 0 0)}
  nav .links a{display:block;padding:16px 24px;border-bottom:1px solid var(--line);color:var(--ink);text-shadow:none}
  .links a::after{display:none}
}

/* ---------- hero on video ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:max(680px,100svh);display:flex;flex-direction:column;justify-content:center;padding:110px 0 90px;text-align:center;color:#fff}
.hero .vbg{background-color:var(--sea2);background-image:linear-gradient(180deg,var(--tint),var(--accent) 60%,var(--sun))}
.hero .vbg{--veil:linear-gradient(180deg,color-mix(in srgb,var(--tint) 62%,transparent) 0%,color-mix(in srgb,var(--tint) 28%,transparent) 42%,color-mix(in srgb,var(--tint) 34%,transparent) 70%,color-mix(in srgb,var(--tint) 72%,transparent) 100%)}
.hero .vbg video{transform:scale(1.08);transition:opacity 1.2s ease,transform calc(14s*var(--speed)) ease-out}
.go .hero .vbg video{transform:scale(1)}
.hcontent{position:relative}
.cross{width:28px;height:40px;margin:0 auto 14px;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--sun) 80%,transparent))}
.invite{max-width:46ch;margin:0 auto;font-family:var(--f-head);font-size:20px;font-style:italic;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.names{font-family:var(--f-script);font-weight:400;font-size:clamp(70px,14vw,156px);line-height:1.1;margin:12px 0 2px;color:var(--name-color,#fff);text-shadow:0 4px 34px rgba(0,0,0,.35)}
.names .ch{display:inline-block;animation:rise calc(1.3s*var(--speed)) cubic-bezier(.2,.8,.2,1) both;animation-delay:calc((var(--i) * 65ms + 500ms) * var(--speed))}
.names .amp{font-size:.55em;color:var(--amp-color,var(--sun));padding:0 .15em;vertical-align:.25em}
@keyframes rise{from{opacity:0;transform:translateY(50px);filter:blur(10px)}}
.parents{display:flex;justify-content:center;gap:6px 40px;flex-wrap:wrap;font-size:14px;margin-bottom:18px;opacity:.92;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.date-line{font-family:var(--f-head);font-size:clamp(22px,3vw,28px);letter-spacing:.08em;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.city{letter-spacing:.2em;text-transform:uppercase;font-size:13px;margin-top:4px;opacity:.92;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.verse{margin:24px auto 0;max-width:46ch;font-family:var(--f-head);font-style:italic;font-size:21px;text-shadow:0 1px 14px rgba(0,0,0,.4)}
.verse .w{display:inline-block;animation:wfade calc(.8s*var(--speed)) ease both;animation-delay:calc((var(--i) * 80ms + 1700ms) * var(--speed))}
.verse cite{display:block;font-style:normal;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun);margin-top:8px;font-family:var(--f-body)}
@keyframes wfade{from{opacity:0;transform:translateY(10px)}}
.js body:not(.go) .hero .hcontent *{animation-play-state:paused!important}
.countdown{display:flex;justify-content:center;gap:12px;margin:36px 0 28px;flex-wrap:wrap}
.unit{width:96px;padding:14px 6px 10px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);perspective:400px}
.unit b{display:block;font-family:var(--f-head);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.unit b.flip{animation:flipNum .55s cubic-bezier(.3,1.4,.6,1)}
@keyframes flipNum{0%{transform:rotateX(90deg);opacity:.2}100%{transform:none}}
.unit span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero .btn.solid{background:var(--sun);border-color:var(--sun);color:#3a2410}
.hero .btn.ghost{color:#fff;border-color:#fff}
.hero .btn.ghost:hover{background:#fff;color:var(--ink)}
.scroll-cue{position:absolute;left:50%;bottom:26px;width:24px;height:38px;margin-left:-12px;border:1.5px solid rgba(255,255,255,.8);border-radius:14px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{60%{transform:translateY(12px);opacity:0}}

/* dawn opening */
#dawnIntro{position:fixed;inset:0;z-index:100;background:#06070d;color:#fff;display:grid;place-items:center;text-align:center;cursor:pointer;transition:opacity calc(1.8s*var(--speed)) ease}
#dawnIntro b{display:block;font-family:var(--f-script);font-weight:400;font-size:clamp(64px,12vw,120px);line-height:1.1;opacity:0;transform:translateY(16px);transition:opacity calc(1.2s*var(--speed)) ease .2s,transform calc(1.2s*var(--speed)) ease .2s}
#dawnIntro small{display:block;letter-spacing:.24em;text-transform:uppercase;font-size:12px;opacity:0;transition:opacity calc(1s*var(--speed)) ease .9s}
#dawnIntro .glow{position:absolute;left:50%;top:62%;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 55%,transparent),transparent 60%);opacity:0;transform:translateY(20%) scale(.6);transition:opacity calc(2.4s*var(--speed)) ease .4s,transform calc(2.8s*var(--speed)) cubic-bezier(.25,.6,.2,1) .4s}
#dawnIntro.play b,#dawnIntro.play small{opacity:1;transform:none}
#dawnIntro.play .glow{opacity:1;transform:none}
#dawnIntro.leave{opacity:0;pointer-events:none}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* couple portraits with a sun halo */
.person .portrait{border:5px solid var(--bg2)}
.person{position:relative;isolation:isolate}
.person::before{content:"";position:absolute;top:-30px;left:50%;width:min(360px,90vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 55%,transparent),transparent 65%);z-index:-1}

.venue .art{background:linear-gradient(180deg,color-mix(in srgb,var(--soft) 45%,var(--bg2)),var(--bg2))}
.vw{animation:drift calc(12s*var(--speed)) linear infinite}
.vsun{animation:pulse calc(5s*var(--speed)) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
.bulb{animation:twk calc(2s*var(--speed)) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes twk{to{opacity:.3}}

footer.closing{position:relative;text-align:center;padding:100px 20px 110px;background:linear-gradient(180deg,var(--sea1),var(--sea2));color:#fff}
footer .tag{font-family:var(--f-script);font-size:clamp(50px,8vw,86px);line-height:1.2;color:#fff}
footer p{opacity:.92}
footer .cross{margin-bottom:10px}

@media (max-width:600px){ .hero{padding-top:96px} .unit{width:78px} .unit b{font-size:38px} }
@media (prefers-reduced-motion:reduce){ .sunmark path{stroke-dashoffset:0} }
</style>
</head>
<body>
<div id="progress"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cross" viewBox="0 0 34 48"><path d="M13 0h8v13h13v8H21v27h-8V21H0v-8h13z" style="fill:var(--sun)"/></symbol>
    <symbol id="sunmark" viewBox="0 0 120 48">
      <g fill="none" stroke-width="1.6" stroke-linecap="round">
        <path d="M34 30 A26 26 0 0 1 86 30" style="stroke:var(--gold)"/>
        <path d="M60 2 V10 M36 10 L41 16 M84 10 L79 16 M22 24 H29 M91 24 H98" style="stroke:var(--gold)"/>
        <path d="M6 34 Q18 28 30 34 T54 34 T78 34 T102 34 T114 34" style="stroke:var(--accent)"/>
        <path d="M18 42 Q30 36 42 42 T66 42 T90 42 T102 42" style="stroke:var(--accent)"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="dawnIntro" hidden>
  <div class="glow"></div>
  <div style="position:relative"><b id="introNames">R &amp; T</b><small id="introDate"></small></div>
</div>

<nav id="nav">
  <div class="wrap">
    <a class="mono" href="#home" id="mono">R &amp; T</a>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="links"><span></span><span></span><span></span></button>
    <ul class="links" id="links"></ul>
  </div>
</nav>

<header class="hero" id="home">
  <div class="vbg" id="heroVideo"></div>
  <div class="wrap hcontent">
    <svg class="cross" aria-hidden="true"><use href="#cross"/></svg>
    <p class="invite" id="invite"></p>
    <h1 class="names" id="names"></h1>
    <div class="parents" id="parents"></div>
    <p class="date-line" id="dateLine"></p>
    <p class="city" id="city"></p>
    <blockquote class="verse" id="verse"></blockquote>
    <div class="countdown" aria-label="Countdown to the wedding">
      <div class="unit"><b id="cd-d">00</b><span>Days</span></div>
      <div class="unit"><b id="cd-h">00</b><span>Hours</span></div>
      <div class="unit"><b id="cd-m">00</b><span>Minutes</span></div>
      <div class="unit"><b id="cd-s">00</b><span>Seconds</span></div>
    </div>
    <div class="btns">
      <a class="btn solid" id="heroRsvp" href="#rsvp">RSVP</a>
      <a class="btn ghost" id="calBtn" href="#" target="_blank" rel="noopener">Add to calendar</a>
    </div>
  </div>
  <span class="scroll-cue" aria-hidden="true"></span>
</header>

<main id="sections">
  <section id="couple" data-sec="couple">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
      <div id="coupleGrid"></div>
    </div>
  </section>
  <section id="events" data-sec="events">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
    </div>
    <div class="wrap"><div class="tl" id="timeline"><div class="tl-line"></div><div class="tl-fill" id="tlFill"></div></div></div>
  </section>
  <section id="story" data-sec="story">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
      <div class="story" id="storyGrid"></div>
    </div>
  </section>
  <section id="gallery" data-sec="gallery">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
    </div>
    <div class="wrap"><div class="gallery" id="galleryGrid"></div></div>
  </section>
  <section id="venues" data-sec="venues">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
    </div>
    <div class="wrap"><div class="venues" id="venueGrid"></div></div>
  </section>
  <section id="rsvp" data-sec="rsvp">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
      <p class="lede" id="rsvpBy" data-anim="up"></p>
      <div id="rsvpMount"></div>
    </div>
  </section>
  <section id="faq" data-sec="faq">
    <div class="wrap center">
      <svg class="sunmark" data-draw aria-hidden="true"><use href="#sunmark"/></svg>
      <p class="eyebrow" data-t="eyebrow" data-anim="up"></p>
      <h2 class="sec-title" data-t="title" data-anim="blur"></h2>
      <div class="faq" id="faqList"></div>
    </div>
  </section>
</main>

<footer class="closing" id="closing">
  <svg class="cross" aria-hidden="true" style="width:30px;height:42px"><use href="#cross"/></svg>
  <p class="tag" id="hashtag"></p>
  <p id="footNames"></p>
</footer>

<script>
(function(){
"use strict";
const WS = window.WeddingSite; if (!WS) return;
const { $, $$, reduce } = WS;

function wavePath(w, h, amp, periods, base){
  let d = `M0 ${h} L0 ${base}`; const step = w / (periods * 8);
  for (let x = 0; x <= w + .1; x += step) d += ` L${x.toFixed(1)} ${(base + Math.sin(x / w * periods * 2 * Math.PI) * amp).toFixed(1)}`;
  return d + ` L${w} ${h} Z`;
}

/* ---------- golden light + sakura petals ---------- */
const fc = $("#fx"), fx = fc.getContext("2d");
let dpr = 1, FW = 0, FH = 0, glow = [], pet = [], bits = [], sunCol = "#ffe08a", petCols = ["#f6b8c8", "#f9d3dd", "#f0a3b8"], running = false;
function size(){ dpr = Math.min(2, devicePixelRatio || 1); FW = fc.width = innerWidth * dpr; FH = fc.height = innerHeight * dpr; }
size(); addEventListener("resize", size);
const mk = () => ({ x:Math.random() * FW, y:Math.random() * FH, r:(4 + Math.random() * 16) * dpr, vy:(.15 + Math.random() * .35) * dpr, ph:Math.random() * 6.28, a:.06 + Math.random() * .14 });
const mp = () => ({ x:Math.random() * FW, y:Math.random() * FH, s:(5 + Math.random() * 6) * dpr, vy:(.4 + Math.random() * .7) * dpr, sw:Math.random() * 6.28, rot:Math.random() * 6.28, vr:(Math.random() - .5) * .04, fl:Math.random() * 6.28, vf:.02 + Math.random() * .04, c:petCols[Math.random() * 3 | 0] });
function setAmbient(kind, amount){
  const n = reduce ? 0 : Math.max(0, Math.min(100, amount | 0));
  const g = kind === "glow" || kind === "both" ? Math.round(n * .45) : 0, p = kind === "petals" || kind === "both" ? Math.round(n * .6) : 0;
  glow = glow.slice(0, g); while (glow.length < g) glow.push(mk());
  pet = pet.slice(0, p); while (pet.length < p) pet.push(mp());
  kick();
}
function kick(){ if (!running && !reduce && (glow.length || pet.length || bits.length)) { running = true; requestAnimationFrame(loop); } }
function burst(x, y, n){
  if (reduce) return;
  const cols = [sunCol, "#ffffff", petCols[0], petCols[2]];
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = (2 + Math.random() * 8) * dpr; bits.push({ x:x * dpr, y:y * dpr, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 4 * dpr, r:(2 + Math.random() * 4) * dpr, c:cols[i % cols.length], life:120 + Math.random() * 60, star:i % 2 === 0 }); }
  kick();
}
function star(x, y, s){ fx.beginPath(); fx.moveTo(x, y - s * 2); fx.lineTo(x + s * .4, y - s * .4); fx.lineTo(x + s * 2, y); fx.lineTo(x + s * .4, y + s * .4); fx.lineTo(x, y + s * 2); fx.lineTo(x - s * .4, y + s * .4); fx.lineTo(x - s * 2, y); fx.lineTo(x - s * .4, y - s * .4); fx.closePath(); fx.fill(); }
function petal(p){
  const s = p.s; fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.scale(Math.cos(p.fl), 1);
  fx.beginPath(); fx.moveTo(0, s); fx.bezierCurveTo(-s*1.15, s*.25, -s*.75, -s, -s*.2, -s); fx.lineTo(0, -s*.72); fx.lineTo(s*.2, -s); fx.bezierCurveTo(s*.75, -s, s*1.15, s*.25, 0, s);
  fx.globalAlpha = .85; fx.fillStyle = p.c; fx.fill(); fx.restore();
}
function loop(){
  fx.clearRect(0, 0, FW, FH);
  for (const b of glow) {
    b.y -= b.vy; b.ph += .012; b.x += Math.sin(b.ph) * .3 * dpr; if (b.y < -40) { b.y = FH + 40; b.x = Math.random() * FW; }
    const gr = fx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r); gr.addColorStop(0, sunCol); gr.addColorStop(1, "transparent");
    fx.globalAlpha = b.a * (.6 + .4 * Math.sin(b.ph * 3)); fx.fillStyle = gr; fx.beginPath(); fx.arc(b.x, b.y, b.r, 0, 6.28); fx.fill();
  }
  for (const p of pet) { p.sw += .02; p.x += Math.sin(p.sw) * .8 * dpr + .25 * dpr; p.y += p.vy; p.rot += p.vr; p.fl += p.vf; if (p.y > FH + 30) { p.y = -30; p.x = Math.random() * FW; } if (p.x > FW + 30) p.x = -30; petal(p); }
  for (const p of bits) { p.vx *= .97; p.vy = p.vy * .97 + .18 * dpr; p.x += p.vx; p.y += p.vy; p.life--; fx.globalAlpha = Math.min(1, p.life / 40); fx.fillStyle = p.c; if (p.star) star(p.x, p.y, p.r * .8); else { fx.beginPath(); fx.arc(p.x, p.y, p.r, 0, 6.28); fx.fill(); } }
  bits = bits.filter(p => p.life > 0); fx.globalAlpha = 1;
  if (glow.length || pet.length || bits.length) requestAnimationFrame(loop); else { running = false; fx.clearRect(0, 0, FW, FH); }
}
document.addEventListener("click", e => { if (!e.target.closest("button,a,input,select,textarea,label,#panel,#dawnIntro,.intro-iris")) burst(e.clientX, e.clientY, 14); });

/* ---------- openings ---------- */
let introT;
function playIntro(){
  const D = WS.D, sp = +D.speed || 1, el = $("#dawnIntro");
  el.hidden = true; el.classList.remove("play", "leave");
  const ir = $("#irisIntro"); if (ir) ir.hidden = true;
  if (D.intro === "none" || reduce) { WS.start(); return; }
  if (D.intro === "iris") { WS.iris(); return; }
  document.body.classList.remove("go"); el.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("play")));
  let done = false;
  const open = () => { if (done) return; done = true; el.classList.add("leave"); WS.start(); setTimeout(() => { el.hidden = true; }, 1900 * sp); };
  el.onclick = open; clearTimeout(introT); introT = setTimeout(open, 2600 * sp);
}

/* ---------- venue drawings ---------- */
const seaLine = (y, c) => `<g class="vw"><path d="${wavePath(600, 20, 3, 12, 6)}" transform="translate(0 ${y})" style="fill:${c}"/></g>`;
const churchArt = () => `<svg viewBox="0 0 300 170" aria-hidden="true" style="overflow:hidden">
  <circle class="vsun" cx="235" cy="70" r="26" style="fill:var(--sun)" opacity=".9"/>
  <g fill="none" style="stroke:var(--accent)" stroke-width="1.8" stroke-linejoin="round">
    <path d="M70 150 V96 L140 52 L210 96 V150"/><path d="M118 150 V70 L140 52 L162 70 V150"/>
    <path d="M140 52 V26 M131 34 H149" style="stroke:var(--gold)" stroke-width="2.4"/>
    <path d="M131 150 V126 A9 9 0 0 1 149 126 V150"/><circle cx="140" cy="94" r="10"/>
    <path d="M90 150 V124 A8 8 0 0 1 106 124 V150 M174 150 V124 A8 8 0 0 1 190 124 V150"/>
  </g>${seaLine(148, "var(--sea1)")}${seaLine(156, "var(--sea2)")}</svg>`;
const beachArt = () => `<svg viewBox="0 0 300 170" aria-hidden="true" style="overflow:hidden">
  <circle class="vsun" cx="60" cy="74" r="22" style="fill:var(--sun)" opacity=".9"/>
  <g fill="none" style="stroke:var(--accent)" stroke-width="1.8" stroke-linejoin="round">
    <path d="M100 150 V90 M240 150 V90 M90 92 L170 56 L250 92"/>
    <path d="M100 96 Q135 112 170 96 Q205 112 240 96" style="stroke:var(--gold)" stroke-width="1.2"/>
    <path d="M150 150 V128 H190 V150 M146 128 H194"/>
  </g>
  ${[110,125,140,155,170,185,200,215,230].map((x, i) => `<circle class="bulb" cx="${x}" cy="${100 + Math.sin(i / 8 * Math.PI) * 8}" r="2.6" style="fill:var(--sun);--d:${(i * .2).toFixed(1)}s"/>`).join("")}
  ${seaLine(148, "var(--sea1)")}${seaLine(156, "var(--sea2)")}</svg>`;

/* ---------- start ---------- */
WS.init({
  key: "ocean",
  defaultFonts: { script:"Great Vibes", heading:"Cormorant Garamond", body:"Mulish" },
  themes: {
    golden:   { name:"Golden hour",       bg:"#fff8f0", bg2:"#ffffff", ink:"#1f2b3d", muted:"#6d6a75", soft:"#ffd2a8", accent:"#c8603f", gold:"#c98a1c", sea1:"#2f6f8f", sea2:"#143a5a", sun:"#ffe08a", tint:"#2a1a2e" },
    dawn:     { name:"Pastel dawn",       bg:"#fbf6f8", bg2:"#ffffff", ink:"#2d2a44", muted:"#7a748c", soft:"#f6c9d6", accent:"#c45f84", gold:"#b98a4e", sea1:"#8fb8cf", sea2:"#4d7698", sun:"#fff1c9", tint:"#3b2c4f" },
    tropical: { name:"Tropical morning",  bg:"#f3fbfb", bg2:"#ffffff", ink:"#0f3440", muted:"#5b7a80", soft:"#bfe9e4", accent:"#0f8f8a", gold:"#d89a24", sea1:"#29b3b0", sea2:"#0f6f8a", sun:"#fff6d6", tint:"#0c3440" },
    dusk:     { name:"Violet dusk",       bg:"#15172e", bg2:"#1f2242", ink:"#f7ecdf", muted:"#b8b0c8", soft:"#6b3d6e", accent:"#f08a5d", gold:"#ffc46b", sea1:"#3b3a6e", sea2:"#15173a", sun:"#ffc46b", tint:"#140f2c", dark:true },
    pearl:    { name:"Pearl & sea glass", bg:"#fbfaf7", bg2:"#ffffff", ink:"#263238", muted:"#78858c", soft:"#d8e8ec", accent:"#4f8aa3", gold:"#b0915a", sea1:"#a8c6d4", sea2:"#7aa1b5", sun:"#fffaf0", tint:"#2b3940" },
  },
  swatch: t => `linear-gradient(180deg,${t.tint} 0 38%,${t.sun} 38% 52%,${t.accent} 52% 72%,${t.bg} 72%)`,
  intros: [["dawn","Fade up from darkness"],["iris","Open from a circle"],["none","No opening animation"]],
  ambients: [["glow","Golden light specks"],["petals","Falling sakura petals"],["both","Light specks + petals"],["none","None"]],
  venueArt: i => i === 0 ? churchArt() : beachArt(),
  onTheme: t => { sunCol = t.sun; },
  setAmbient,
  playIntro,
  celebrate: (x, y) => burst(x, y, 90),
  onStart: () => setAmbient(WS.D.ambient, WS.D.amount),
});
if (WS.D) {
  // wave edges where each section meets the one above it
  $$("#sections > section:not([hidden]), #closing").forEach((sec, i) => {
    if (sec.querySelector(":scope > .edge")) return;
    sec.insertAdjacentHTML("afterbegin", `<div class="edge" aria-hidden="true"><svg viewBox="0 0 2400 40" preserveAspectRatio="none"><path d="${wavePath(2400, 40, 9, 8 + (i % 3) * 2, 20)}"/></svg></div>`);
  });
  $("#closing .edge path").style.fill = "var(--sea1)";
  if ($("#closing").classList.contains("has-video")) $("#closing .edge").remove();
  playIntro();
}
})();
